[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicomp"
version = "0.9.0"
description = "OmniComp v8 TURBO: a lossless adaptive multi-niche compressor with a 100%% C pipeline."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "OmniComp contributors" }]
keywords = ["compression", "lossless", "zstd", "numerical", "adaptive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
zxc = "omnicomp.cli:main"

[project.urls]
Homepage = "https://github.com/omnicomp/omnicomp"
Repository = "https://github.com/omnicomp/omnicomp"
Issues = "https://github.com/omnicomp/omnicomp/issues"
Changelog = "https://github.com/omnicomp/omnicomp/blob/main/README.md#changelog"

[tool.setuptools]
packages = ["omnicomp"]

[tool.setuptools.package-data]
omnicomp = ["*.c", "*.so", "*.dylib"]
